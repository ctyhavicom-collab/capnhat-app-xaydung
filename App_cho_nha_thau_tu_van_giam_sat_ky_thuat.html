<title>App cho nhà thầu tư vấn giám sát kỹ thuật - Lê Quang Hòa</title>
<style>
:root{
  --bg:#f4f6f8; --card:#fff; --ink:#1b2733; --mut:#64748b; --line:#dbe2e9;
  --pri:#0e5a8a; --pri2:#0b4669; --pri-soft:#e6f1f8; --ok:#1d8a4e; --ok-soft:#e5f5ec;
  --warn:#b7791f; --warn-soft:#fdf3dc; --bad:#c0392b; --bad-soft:#fbe9e7;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:15px/1.45 "Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--pri)}
#app{display:grid;grid-template-columns:236px 1fr;height:100vh}
#side{background:var(--pri2);color:#e9f2f8;display:flex;flex-direction:column;overflow:auto}
#side .brand{padding:16px 16px 10px}
#side .brand b{display:block;font-size:19px;letter-spacing:.2px;color:#fff}
#side .brand span{font-size:12.5px;opacity:.85}
#side nav{padding:6px 8px;flex:1}
#side nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;color:#d6e6f1;text-decoration:none;margin:2px 0;cursor:pointer}
#side nav a:hover{background:rgba(255,255,255,.09)}
#side nav a.on{background:#fff;color:var(--pri2);font-weight:600}
#side nav a i{font-style:normal;width:20px;text-align:center}
#side nav .cnt{margin-left:auto;font-size:11.5px;background:rgba(255,255,255,.18);border-radius:10px;padding:1px 7px}
#side nav a.on .cnt{background:var(--pri-soft)}
#side .author{padding:12px 16px;font-size:12px;border-top:1px solid rgba(255,255,255,.14);opacity:.95}
#side .author b{color:#fff}
#main{display:flex;flex-direction:column;min-width:0;height:100vh}
#top{display:flex;align-items:center;gap:10px;padding:10px 18px;background:var(--card);border-bottom:1px solid var(--line);flex-wrap:wrap}
#top h1{font-size:16px;margin:0;font-weight:650;flex:1;min-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top .sv{font-size:12.5px;color:var(--mut)}
#view{flex:1;overflow:auto;padding:18px 22px 60px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 13px;cursor:pointer;font-weight:550;white-space:nowrap}
.btn:hover{border-color:var(--pri);color:var(--pri)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.pri:hover{background:var(--pri2);color:#fff}
.btn.sm{padding:4px 9px;font-size:13px}
.btn.bad{color:var(--bad)}
.btn[disabled]{opacity:.5;pointer-events:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:16px}
.card h2{margin:0 0 10px;font-size:16px}
.card h3{margin:14px 0 6px;font-size:14px;color:var(--pri2)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1000px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){#app{grid-template-columns:1fr}#side{position:fixed;z-index:30;left:-250px;width:236px;height:100%;transition:left .2s}#side.open{left:0}.g2,.g3,.g4{grid-template-columns:1fr}#menuBtn{display:inline-flex!important}}
#menuBtn{display:none}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.stat b{font-size:26px;display:block;line-height:1.1}
.stat span{color:var(--mut);font-size:13px}
.bar{height:9px;background:#e6ebf0;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pri);border-radius:6px}
.bar.ok i{background:var(--ok)}
.lbl{display:block;font-size:12.5px;color:var(--mut);margin:0 0 3px;font-weight:600}
.fld{width:100%;border:1px solid var(--line);border-radius:7px;padding:7px 9px;background:#fff}
.fld:focus,.cell:focus{outline:2px solid #9cc8e6;border-color:var(--pri)}
textarea.fld{min-height:64px;resize:vertical}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
.form .full{grid-column:1/-1}
@media(max-width:760px){.form{grid-template-columns:1fr}}
.tw{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:#fff}
table.t{border-collapse:collapse;width:100%;font-size:13.5px}
table.t th{position:sticky;top:0;background:#eef3f7;text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:1}
table.t td{padding:3px 5px;border-bottom:1px solid #edf1f4;vertical-align:middle}
table.t tr:hover td{background:#fafcfd}
table.t td.n{text-align:center;color:var(--mut);width:34px}
.cell{width:100%;border:1px solid transparent;background:transparent;padding:5px 6px;border-radius:6px;min-width:70px}
.cell:hover{border-color:var(--line);background:#fff}
select.cell{padding:4px 2px}
.tag{display:inline-block;padding:2px 9px;border-radius:12px;font-size:12px;font-weight:600;background:#e8edf2;color:#475569}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.pri{background:var(--pri-soft);color:var(--pri)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.tools .sp{flex:1}
.hint{color:var(--mut);font-size:13px}
.note{background:var(--warn-soft);border-left:4px solid var(--warn);padding:9px 12px;border-radius:6px;font-size:13.5px;margin:10px 0}
.note.ok{background:var(--ok-soft);border-color:var(--ok)}
.note.bad{background:var(--bad-soft);border-color:var(--bad)}
.todo{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid #edf1f4}
.todo:last-child{border:0}
.todo .go{margin-left:auto}
.grp-h td{background:#f1f5f8;font-weight:700;color:var(--pri2);padding:7px 10px!important}
.modal{position:fixed;inset:0;background:rgba(15,30,45,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 12px}
.modal .box{background:#fff;border-radius:12px;max-width:760px;width:100%;padding:20px 22px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal .box h2{margin:0 0 12px}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(max-width:600px){.choices{grid-template-columns:1fr}}
.choice{border:2px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;background:#fff;text-align:left}
.choice:hover{border-color:#8ebfe0}
.choice.on{border-color:var(--pri);background:var(--pri-soft)}
.choice b{display:block}
.choice span{font-size:12.5px;color:var(--mut)}
#viewer{position:fixed;inset:0;z-index:60;background:#6b7785;display:none;flex-direction:column}
#viewer.show{display:flex}
#vbar{display:flex;gap:8px;align-items:center;padding:8px 14px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap}
#vbar .ttl{font-weight:650;flex:1;min-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#vbody{flex:1;overflow:auto;padding:18px 0 60px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#1b2733;color:#fff;padding:10px 18px;border-radius:24px;z-index:99;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.3)}
/* ===== Giấy A4 ===== */
.paper{background:#fff;color:#000;width:210mm;min-height:297mm;padding:20mm 20mm 20mm 30mm;margin:0 auto 18px;box-shadow:0 4px 18px rgba(0,0,0,.35);font:14pt/1.35 "Times New Roman",Times,serif;text-align:justify;outline:none}
.paper.land{width:297mm;min-height:210mm;padding:20mm 20mm 20mm 30mm}
.paper p{margin:0 0 6pt}
.paper .c{text-align:center}
.paper .r{text-align:right}
.paper .b{font-weight:700}
.paper .i{font-style:italic}
.paper .u{text-decoration:underline}
.paper .hd{width:100%;border-collapse:collapse;margin-bottom:10pt}
.paper .hd td{vertical-align:top;text-align:center;padding:0 2pt;font-size:13pt}
.paper .hd .qh{font-weight:700}
.paper .hd .tn{font-weight:700;border-bottom:0}
.paper .ttl{text-align:center;font-weight:700;font-size:15pt;margin:12pt 0 2pt;text-transform:uppercase}
.paper .sub{text-align:center;font-style:italic;margin-bottom:10pt}
.paper h4{margin:10pt 0 4pt;font-size:14pt}
.paper ul,.paper ol{margin:0 0 6pt;padding-left:22pt}
.paper li{margin-bottom:3pt}
.paper table.tb{border-collapse:collapse;width:100%;margin:4pt 0 8pt}
.paper table.tb th,.paper table.tb td{border:1px solid #000;padding:2pt 4pt;font-size:12pt;vertical-align:top;text-align:left}
.paper table.tb th{text-align:center;font-weight:700;background:#f2f2f2}
.paper table.sg{width:100%;border-collapse:collapse;margin-top:14pt;page-break-inside:avoid}
.paper table.sg td{text-align:center;vertical-align:top;padding:2pt 4pt;font-size:13pt}
.paper .gap{background:#fff3b0;border-radius:2px}
.paper .foot{margin-top:18pt;font-size:10pt;color:#555;text-align:center;font-style:italic}
.paper [contenteditable]:focus{outline:none}
.paper .nb{page-break-inside:avoid}
#printRoot{display:none}
@media print{
  html,body{height:auto;background:#fff}
  body>*:not(#printRoot){display:none!important}
  #printRoot{display:block!important}
  .paper{box-shadow:none!important;margin:0!important;width:auto!important;min-height:0!important;padding:0!important;page-break-after:always;zoom:1!important}
  .paper:last-child{page-break-after:auto}
  .paper .gap{background:transparent!important}
  .paper.land{page:land}
  @page{size:A4 portrait;margin:20mm 20mm 20mm 30mm}
  @page land{size:A4 landscape;margin:20mm 20mm 20mm 30mm}
}

/* ===== Nút dạng 3D nổi: dễ nhìn, dễ bấm ===== */
.btn{background:linear-gradient(180deg,#ffffff 0%,#e8eef4 100%);border:1px solid #aebccb;border-radius:9px;box-shadow:0 3px 0 #98a8b8,0 5px 8px rgba(20,40,60,.18),inset 0 1px 0 #fff;transform:translateY(-1px);transition:transform .08s,box-shadow .08s,filter .12s;margin-bottom:3px}
.btn:hover{border-color:var(--pri);color:var(--pri);filter:brightness(1.03);box-shadow:0 4px 0 #8798a9,0 7px 10px rgba(20,40,60,.22),inset 0 1px 0 #fff;transform:translateY(-2px)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #98a8b8,0 1px 2px rgba(20,40,60,.2),inset 0 2px 3px rgba(0,0,0,.12)}
.btn.pri{background:linear-gradient(180deg,#2a85bd 0%,var(--pri) 55%,var(--pri2) 100%);border-color:var(--pri2);color:#fff;text-shadow:0 -1px 0 rgba(0,0,0,.25);box-shadow:0 3px 0 #082f47,0 5px 9px rgba(8,47,71,.35),inset 0 1px 0 rgba(255,255,255,.35)}
.btn.pri:hover{background:linear-gradient(180deg,#3593cc 0%,#0f64a0 55%,var(--pri2) 100%);color:#fff;box-shadow:0 4px 0 #082f47,0 7px 12px rgba(8,47,71,.4),inset 0 1px 0 rgba(255,255,255,.4)}
.btn.pri:active{box-shadow:0 1px 0 #082f47,0 1px 2px rgba(8,47,71,.35),inset 0 2px 4px rgba(0,0,0,.3)}
.btn.bad{box-shadow:0 3px 0 #b9a0a0,0 5px 8px rgba(120,30,20,.18),inset 0 1px 0 #fff}
.btn[disabled]{box-shadow:none;transform:none;filter:grayscale(.4)}
#side nav a{margin:5px 0;background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.05));box-shadow:0 3px 0 rgba(0,0,0,.32),0 5px 8px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.22);transform:translateY(-1px);transition:transform .08s,box-shadow .08s}
#side nav a:hover{background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,.1));transform:translateY(-2px);box-shadow:0 4px 0 rgba(0,0,0,.34),0 7px 10px rgba(0,0,0,.24),inset 0 1px 0 rgba(255,255,255,.3)}
#side nav a:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.32),inset 0 2px 4px rgba(0,0,0,.3)}
#side nav a.on{background:linear-gradient(180deg,#fff,#dfe9f1);box-shadow:0 3px 0 #7f98ad,0 5px 9px rgba(0,0,0,.28),inset 0 1px 0 #fff}
.choice{background:linear-gradient(180deg,#fff,#eef3f7);box-shadow:0 3px 0 #b3c1cf,0 5px 8px rgba(20,40,60,.14),inset 0 1px 0 #fff;transform:translateY(-1px);transition:transform .08s,box-shadow .08s;margin-bottom:3px}
.choice:hover{transform:translateY(-2px);box-shadow:0 4px 0 #9fb2c4,0 7px 10px rgba(20,40,60,.2),inset 0 1px 0 #fff}
.choice:active{transform:translateY(2px);box-shadow:0 1px 0 #b3c1cf,inset 0 2px 3px rgba(0,0,0,.12)}
.choice.on{background:linear-gradient(180deg,#f2f9fe,var(--pri-soft));box-shadow:0 3px 0 #5f9cc4,0 5px 8px rgba(14,90,138,.25),inset 0 1px 0 #fff}

/* Tiến độ thi công cùng Mr_Hòa, tác giả Lê Quang Hòa. Mọi chọn lọc nằm trong #td-root. Mô-đun JS đã nhúng sẵn bản CSS này vào Shadow DOM, tệp này chỉ cần nạp nếu khung muốn dùng riêng. */
#td-root{--bg:#f3f5f8;--pn:#fff;--ln:#d9dee6;--ln2:#e8ebf0;--tx:#1d2733;--mu:#6b7785;--ac:#1f5fa8;--ac2:#e6effa;--rd:#c0392b;--gn:#2e7d32;--or:#d98200;--hd:#eef2f7}
#td-root *{box-sizing:border-box}
#td-root .tdapp{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;font:13px/1.4 "Segoe UI",Arial,sans-serif;color:var(--tx);background:var(--bg)}
#td-root .tdapp:focus{outline:none}
#td-root button{font:inherit;color:inherit;border:1px solid var(--ln);background:#fff;border-radius:5px;padding:4px 9px;cursor:pointer;white-space:nowrap}
#td-root button:hover{background:var(--ac2);border-color:#9bbbe3}
#td-root button:disabled{opacity:.45;cursor:default}
#td-root button.pri{background:var(--ac);border-color:var(--ac);color:#fff}
#td-root button.pri:hover{background:#184c87}
#td-root button.dng{color:var(--rd)}
#td-root button.on{background:var(--ac2);border-color:var(--ac);color:var(--ac);font-weight:600}
#td-root input,#td-root select,#td-root textarea{font:inherit;color:inherit}
#td-root input[type=text],#td-root input[type=number],#td-root input[type=date],#td-root select,#td-root textarea{border:1px solid var(--ln);border-radius:5px;padding:4px 7px;background:#fff;max-width:100%}
#td-root input:focus,#td-root select:focus,#td-root textarea:focus{outline:2px solid #9bbbe3;border-color:var(--ac)}
#td-root #top{display:flex;align-items:center;gap:10px;padding:7px 12px;background:#14365f;color:#fff;flex-wrap:wrap}
#td-root #top h1{font-size:16px;margin:0;font-weight:600;letter-spacing:.2px}
#td-root #top .sp{flex:1}
#td-root #top button{background:#1f4a7c;border-color:#3a6aa0;color:#fff}
#td-root #top button:hover{background:#2a5d9a}
#td-root .menu{position:relative;display:inline-block}
#td-root .menu>.dd{display:none;position:absolute;top:100%;left:0;margin-top:3px;background:#fff;color:var(--tx);border:1px solid var(--ln);border-radius:6px;box-shadow:0 6px 24px #0003;min-width:230px;z-index:60;padding:4px}
#td-root .menu.open>.dd{display:block}
#td-root .dd button{display:block;width:100%;text-align:left;border:0;background:none;padding:6px 10px;border-radius:4px}
#td-root .dd button:hover{background:var(--ac2)}
#td-root .dd hr{border:0;border-top:1px solid var(--ln2);margin:4px 0}
#td-root #tabs{display:flex;gap:2px;padding:6px 12px 0;background:var(--hd);border-bottom:1px solid var(--ln);overflow-x:auto}
#td-root #tabs button{border:1px solid transparent;border-bottom:0;border-radius:6px 6px 0 0;background:none;padding:6px 14px}
#td-root #tabs button.on{background:#fff;border-color:var(--ln);color:var(--ac);font-weight:600;margin-bottom:-1px}
#td-root #main{flex:1;min-height:0;overflow:auto;background:#fff;position:relative}
#td-root #status{display:flex;gap:18px;flex-wrap:wrap;padding:5px 12px;background:var(--hd);border-top:1px solid var(--ln);font-size:12px}
#td-root #status b{font-weight:600}
#td-root .bad{color:var(--rd)}
#td-root .good{color:var(--gn)}
#td-root .warn{color:var(--or)}
#td-root .bar-tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:6px 10px;border-bottom:1px solid var(--ln);background:#fafbfd}
#td-root .bar-tools .sep{width:1px;align-self:stretch;background:var(--ln);margin:0 3px}
#td-root .bar-tools label{display:inline-flex;align-items:center;gap:4px;color:var(--mu)}
#td-root .pad{padding:16px 18px}
#td-root .card{background:#fff;border:1px solid var(--ln);border-radius:8px;padding:12px 14px}
#td-root .grid{display:grid;gap:12px}
#td-root .g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
#td-root .g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
#td-root .kpi .v{font-size:22px;font-weight:600;margin-top:2px}
#td-root .kpi .l{color:var(--mu);font-size:12px}
#td-root h2{font-size:15px;margin:0 0 8px}
#td-root h3{font-size:13px;margin:12px 0 6px}
#td-root table.t{border-collapse:collapse;width:100%}
#td-root table.t th,#td-root table.t td{border:1px solid var(--ln);padding:4px 7px;text-align:left;vertical-align:top}
#td-root table.t th{background:var(--hd);font-weight:600}
#td-root table.t td.r,#td-root table.t th.r{text-align:right}
#td-root table.t td.c{text-align:center}
#td-root table.t input[type=text],#td-root table.t input[type=number],#td-root table.t select{width:100%;border-color:transparent;background:transparent;padding:2px 4px}
#td-root table.t input:hover,#td-root table.t select:hover{border-color:var(--ln)}
#td-root .fld{display:flex;flex-direction:column;gap:3px;margin-bottom:9px}
#td-root .fld>span{color:var(--mu);font-size:12px}
#td-root .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#td-root .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
#td-root .mut{color:var(--mu)}
#td-root .tag{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11px;background:var(--hd);border:1px solid var(--ln)}
#td-root .tag.rd{background:#fdecea;border-color:#f1b7b0;color:var(--rd)}
#td-root .tag.gn{background:#e8f5e9;border-color:#b5d9b8;color:var(--gn)}
#td-root .tag.or{background:#fff4e0;border-color:#f0cf93;color:var(--or)}
#td-root .ovl{position:absolute;inset:0;background:#0006;display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;z-index:100;overflow:auto}
#td-root .mdl{background:#fff;border-radius:10px;box-shadow:0 12px 48px #0005;width:min(760px,100%);max-height:92vh;display:flex;flex-direction:column}
#td-root .mdl>h2{padding:14px 18px 8px;margin:0;font-size:17px}
#td-root .mdl>.bd{padding:6px 18px 12px;overflow:auto}
#td-root .mdl>.ft{display:flex;gap:8px;justify-content:flex-end;padding:10px 18px;border-top:1px solid var(--ln2)}
#td-root .toasts{position:fixed;bottom:44px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:200;align-items:center}
#td-root .toast{background:#223;color:#fff;padding:8px 14px;border-radius:7px;box-shadow:0 4px 18px #0005;max-width:80vw}
#td-root .toast.err{background:#a32d22}
#td-root .choice{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:8px 0}
#td-root .choice label{border:2px solid var(--ln);border-radius:8px;padding:10px 12px;cursor:pointer;display:block}
#td-root .choice label:has(input:checked){border-color:var(--ac);background:var(--ac2)}
#td-root .choice input{display:none}
#td-root .choice b{display:block}
#td-root .choice small{color:var(--mu)}

    if (!isG[i]) { t._ls = LS[i]; t._lf = LF[i]; t._tf = ES[i] == null ? 0 : calP.cnt(LF[i]) - calP.cnt(EF[i]); t._crit = t._tf <= 0; t._dur = t.dur | 0; t._pct = Math.max(0, Math.min(100, +t.pct || 0)); }

function resUsage(P, A) {

// ----- San bằng nguồn lực (xếp tuần tự theo mức ưu tiên: việc găng, việc có ngày muộn nhất sớm)
function levelResources(P) {
  const lim = {}; (P.res || []).forEach(r => { if (+r.limit > 0) lim[r.code] = +r.limit; });
  if (!Object.keys(lim).length) return { ok: false, msg: 'Chưa đặt "Giới hạn/ngày" cho nguồn lực nào. Vào tab Nguồn lực để nhập.' };
  P.tasks.forEach(t => { t.lv = null; });
  const A = analyze(P), T = P.tasks, n = T.length, C = A.C;
  const ES = new Array(n).fill(null), EF = new Array(n).fill(null), done = new Array(n).fill(false);
  const leaves = []; for (let i = 0; i < n; i++) if (!A.isG[i]) leaves.push(i);
  const lvs = i => A.leavesOf(i);
  const gES = p => { if (!A.isG[p]) return ES[p]; let m = null; lvs(p).forEach(j => { if (ES[j] != null && (m == null || ES[j] < m)) m = ES[j]; }); return m; };
  const gEF = p => { if (!A.isG[p]) return EF[p]; let m = null; lvs(p).forEach(j => { if (EF[j] != null && (m == null || EF[j] > m)) m = EF[j]; }); return m; };
  const ready = i => A.preds[i].every(L => A.isG[L.p] ? lvs(L.p).every(j => done[j]) : done[L.p]);
  const use = {}; Object.keys(lim).forEach(k => { use[k] = new Map(); });
  let left = leaves.length, delayed = 0, guard = 0;
  while (left > 0 && guard++ < n + 5) {
    let best = -1;
    for (const i of leaves) { if (done[i] || !ready(i)) continue; if (best < 0 || T[i]._ls < T[best]._ls || (T[i]._ls === T[best]._ls && i < best)) best = i; }
    if (best < 0) break;
    const t = T[best], c = C(t), d = t.dur | 0; let [s] = A.calc(best, gES, gEF); const base = s;
    const q = {}; Object.keys(t._rq).forEach(k => { if (lim[k] && t._rq[k] <= lim[k]) q[k] = t._rq[k]; });
    if (d > 0 && Object.keys(q).length) {
      for (let tries = 0; tries < 4000; tries++) {
        let ok = true, day = s;
        for (let k = 0; k < d && ok; k++) { if (k > 0) day = c.add(day, 1); for (const code in q) if ((use[code].get(day) || 0) + q[code] > lim[code] + 1e-9) { ok = false; break; } }
        if (ok) break; s = c.add(s, 1);
      }
      let day = s; for (let k = 0; k < d; k++) { if (k > 0) day = c.add(day, 1); for (const code in q) use[code].set(day, (use[code].get(day) || 0) + q[code]); }
    }
    if (s > base) { t.lv = s; delayed++; }
    ES[best] = s; EF[best] = d === 0 ? s : c.add(s, d - 1); done[best] = true; left--;
  }

}

// ----- Co tiến độ về đúng hạn hợp đồng, giữ nguyên tổng công
function compressToDeadline(P, deadline) {
  const Q = JSON.parse(JSON.stringify(P)); Q.tasks.forEach(t => { t.lv = null; });
  let A = analyze(Q); const before = A.PE; const U0 = resUsage(Q, A); const peak0 = resStats(Q, U0);
  if (before <= deadline) return { ok: true, already: true, before };
  const D0 = Q.tasks.map(t => t.dur | 0), R0 = Q.tasks.map(t => parseRes(t.res));
  let f = A.calP.between(Q.start, deadline) / Math.max(1, A.calP.between(Q.start, before)), tries = 0;
  const apply = f => Q.tasks.forEach((t, i) => {
    const d0 = D0[i]; if (d0 < 2) return; const d1 = Math.max(1, Math.round(d0 * f)); t.dur = d1;
    const o = {}; Object.keys(R0[i]).forEach(k => { o[k] = Math.ceil(R0[i][k] * d0 / d1); }); t.res = resText(o);
  });
  do { apply(f); A = analyze(Q); if (A.PE <= deadline) break; f *= 0.985; tries++; } while (tries < 60 && f > 0.05);
  const U1 = resUsage(Q, A), peak1 = resStats(Q, U1);
  return { ok: A.PE <= deadline, before, after: A.PE, factor: f, Q, peak0, peak1 };
}

function sCurveData() {

// ---------- BÁO CÁO + KIỂM TRA
function checkSchedule() {
  const P = S.P, A = S.A, T = P.tasks, out = []; const add = (lv, msg, id) => out.push({ lv, msg, id });
  if (A.cycle.length) add('rd', 'Có vòng lặp liên kết giữa các việc: ' + A.cycle.slice(0, 5).map(i => i + 1).join(', '), T[A.cycle[0]].id);
  if (P.days && A.PE > A.deadline) add('rd', `Tiến độ xong ${fmtD(A.PE)}, vượt hạn hợp đồng ${fmtD(A.deadline)} ${A.PE - A.deadline} ngày. Dùng "Co về hạn HĐ" hoặc cho các việc chạy song song.`);
  const hasSucc = new Set(); A.preds.forEach((ps, i) => ps.forEach(L => { hasSucc.add(L.p); if (A.isG[L.p]) A.leavesOf(L.p).forEach(j => hasSucc.add(j)); }));
  let firstLeaf = true;
  T.forEach((t, i) => {
    if (A.isG[i]) return;
    if (!A.preds[i].length && t.cons == null && t.lv == null && !firstLeaf && t._es !== P.start) add('or', `STT ${i + 1} "${t.name}" không có tiền nhiệm nhưng bắt đầu sau ngày khởi công: có thể thiếu liên kết.`, t.id);
    if (!A.preds[i].length && t.cons == null) { /* việc mở đầu */ } firstLeaf = false;
    if (!hasSucc.has(i) && t._ef !== A.PE && t._tf > 0 && !t.note) add('or', `STT ${i + 1} "${t.name}" không có việc nào chờ sau nó (đứt đầu ra), dự trữ ${t._tf} ngày.`, t.id);
    if (t.dur > 80) add('or', `STT ${i + 1} "${t.name}" dài ${t.dur} ngày. Nên tách nhỏ theo đoạn hoặc theo tầng để theo dõi.`, t.id);
    if (t.dur === 0 && !/nghiệm thu|bàn giao|mốc|khởi công|hoàn thành/i.test(t.name)) add('or', `STT ${i + 1} "${t.name}" có thời lượng 0 (mốc). Đúng ý chưa?`, t.id);
    t.links.forEach(L => { if (Math.abs(L.lag) > 30) add('or', `STT ${i + 1} có lag ${L.lag} ngày: kiểm tra lại.`, t.id); });
    if (Object.keys(t._rq).length === 0 && T.some(u => u.res)) add('gr', `STT ${i + 1} "${t.name}" chưa gán nguồn lực.`, t.id);
  });
  const pins = T.filter(t => t.cons != null).length; if (pins > Math.max(5, T.length * 0.2)) add('or', `Có ${pins} việc bị ghim ngày bắt đầu. Quá nhiều ràng buộc cứng làm tiến độ khó tự điều chỉnh.`);
  const U = resUsage(P, A); P.res.forEach(r => { if (+r.limit > 0 && U.by[r.code]) { let n = 0; U.by[r.code].forEach(v => { if (v > r.limit + 1e-9) n++; }); if (n) add('rd', `${r.code} (${r.name}) vượt giới hạn ${fmtN(r.limit)}/ngày trong ${n} ngày. Bấm "San bằng nguồn lực".`); } });
  const dsum = T.reduce((a, t, i) => a + (A.isG[i] ? 0 : (+t.cost || 0)), 0); if (dsum === 0 && T.length > 8) add('gr', 'Chưa nhập giá trị từng việc: đường cong S sẽ lấy trọng số theo thời lượng.');
  return out;
}
function renderReport() {
  const P = S.P, A = S.A, T = P.tasks; const D = sCurveData(); const chk = checkSchedule(); const rd = P.report;
  const leaves = T.map((t, i) => [t, i]).filter(([t, i]) => !A.isG[i]);
  const planPct = t => rd < t._es ? 0 : rd >= t._ef ? 100 : (t._dur ? A.C(t).between(t._es, rd) / t._dur * 100 : 100);
  const late = leaves.filter(([t]) => t._es <= rd && planPct(t) - t._pct > 5).sort((a, b) => (planPct(b[0]) - b[0]._pct) - (planPct(a[0]) - a[0]._pct));
  const running = leaves.filter(([t]) => t._es <= rd && t._ef >= rd && t._pct < 100);
  const soon = leaves.filter(([t]) => t._es > rd && t._es <= rd + 14).sort((a, b) => a[0]._es - b[0]._es);
  const crit = leaves.filter(([t]) => t._crit && t._dur > 0);
  const margin = P.days ? A.deadline - A.PE : null;

  <div class="grid g4" style="margin-bottom:12px">
   <div class="card kpi"><div class="l">Khởi công → hoàn thành dự kiến</div><div class="v" style="font-size:17px">${fmtD(A.PS)} → ${fmtD(A.PE)}</div><div class="l">${A.calP.between(A.PS, A.PE)} ngày làm việc · ${A.PE - A.PS + 1} ngày lịch</div></div>
   <div class="card kpi"><div class="l">Hạn hợp đồng</div><div class="v" style="font-size:17px">${P.days ? fmtD(A.deadline) : 'chưa nhập'}</div><div class="l ${margin != null && margin < 0 ? 'bad' : 'good'}">${margin == null ? '' : margin >= 0 ? 'Còn dự phòng ' + margin + ' ngày' : 'Quá hạn ' + (-margin) + ' ngày'}</div></div>
   <div class="card kpi"><div class="l">Kế hoạch / Thực tế (lũy kế)</div><div class="v">${D.plan.toFixed(1)}% / ${D.act.toFixed(1)}%</div><div class="l ${D.act - D.plan < -1 ? 'bad' : 'good'}">${D.act - D.plan >= 0 ? '+' : ''}${(D.act - D.plan).toFixed(1)}%</div></div>
   <div class="card kpi"><div class="l">Việc găng / tổng số việc</div><div class="v">${crit.length} / ${leaves.length}</div><div class="l">${running.length} việc đang thi công</div></div></div>
  <div class="grid g2"><div class="card"><h2>Việc chậm so với kế hoạch (${late.length})</h2>${tb(late.map(([t, i]) => li(t, i, `<span class="bad">KH ${Math.round(planPct(t))}% / TT ${Math.round(t._pct)}%</span>`)), 'Kế hoạch / Thực tế', 'Không có việc nào chậm quá 5%.')}</div>

  <div class="card" style="margin-top:12px"><h2>Kiểm tra chất lượng tiến độ <span class="tag rd">${cnt.rd} lỗi</span> <span class="tag or">${cnt.or} cảnh báo</span> <span class="tag">${cnt.gr} gợi ý</span></h2>${chk.length ? `<table class="t">${chk.map(c => `<tr class="jump" data-id="${c.id || ''}"><td style="width:70px"><span class="tag ${c.lv === 'gr' ? '' : c.lv}">${c.lv === 'rd' ? 'Lỗi' : c.lv === 'or' ? 'Cảnh báo' : 'Gợi ý'}</span></td><td>${esc(c.msg)}</td></tr>`).join('')}</table>` : '<p class="good">Tiến độ không có vấn đề nào em phát hiện được. Tốt.</p>'}</div></div>`;

    else if (e.target.id === 'rprint') printReport(); else if (e.target.id === 'rxlsx') exportXlsx();
  };
}

function apFit(recs, opt) {
  const P = S.P;
  const run = f => { const T = apAssemble(recs, f, opt); const Q = Object.assign({}, P, { tasks: T, days: opt.days || 0, res: defaultRes(T) }); const A = analyze(Q); return { T, Q, A, f }; };

    const dl = P.start + opt.days - 1, target = dl - Math.max(1, Math.ceil(opt.days * .03));
    let lo = .15, hi = 12; const rh = run(hi); r = rh;
    if (rh.A.PE <= target) {
      const rl = run(lo);
      if (rl.A.PE <= target) r = rl;
      else { for (let it = 0; it < 22; it++) { const mid = Math.sqrt(lo * hi), rm = run(mid); if (rm.A.PE <= target) { hi = mid; r = rm; } else lo = mid; } }

/* Lưu ngay (dùng khi đóng cửa sổ, chuyển tab). Bản dự phòng tự làm mới mỗi 10 phút, hoặc ngay khi force. */
function doSave(force){
  clearTimeout(saveTimer);
  var js; try{ js = JSON.stringify(S); }catch(e){ setSv("Không lưu được dữ liệu, bấm Lưu file ngay"); return false; }
  Kho.saved(js);
  var ok = lsSet(LS_KEY, js);
  if(!ok){ try{ localStorage.removeItem(BAK_KEY); }catch(e){} ok = lsSet(LS_KEY, js); }
  if(!ok){ setSv("Bộ nhớ trình duyệt đầy. Bấm Lưu file để giữ dữ liệu."); return false; }
  var d = new Date(); setSv("Đã tự lưu lúc " + pad(d.getHours()) + ":" + pad(d.getMinutes()));
  var last = +lsGet(BAK_AT) || 0;
  if((force === true || d.getTime() - last > 600000) && js.length < 1800000){ if(lsSet(BAK_KEY, js)) lsSet(BAK_AT, String(d.getTime())); }
  return true;
}
function restoreBackup(){

}

/* ===== AUTOFIT: tự căn chỉnh văn bản (lề, xuống dòng, cột bảng, ngắt trang). Tác giả: Lê Quang Hòa ===== */
var AUTOFIT = window.AUTOFIT = (function(){
  var NB = "\u00a0";
  function txt(el){ return (el.textContent || "").replace(/[\s\u00a0]+/g, " ").trim(); }
  function bindText(n){
    var t = n.nodeValue, o = t; if(!t || t.length < 3) return;
    t = t.replace(/[ \t\r\n]{2,}/g, " ");
    t = t.replace(/(ngày|tháng|năm) (\d{1,4}|\.{2,}|…+)/gi, function(m, a, b){ return a + NB + b; });
    t = t.replace(/(\d|\.{3,}) (ngày|tháng|năm|m2|m3|m²|m³|cm|mm|km|kg|tấn|đồng|VNĐ|%|giờ|phút|lít|MPa|kN|người|cái|bộ)(?![A-Za-zÀ-ỹ])/g, "$1" + NB + "$2");
    t = t.replace(/(Điều|Khoản|Điểm|Chương|Mục|Phụ lục|Bảng|Hình|Lô|Tờ|Gói thầu số|Km|Lý trình|Nghị định|Thông tư|Luật|Quyết định) (\d|\.{2,}|[IVX]+(?![A-Za-zÀ-ỹ]))/g, "$1" + NB + "$2");
    t = t.replace(/(\d+\/[\w\-\u00C0-\u1EF9\/]+) ([A-ZĐ]{2,}[\w\-\/]*)/g, "$1" + NB + "$2");
    if(t !== o) n.nodeValue = t;
  }
  function textNodes(root){
    var w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null), a = [], n;
    while((n = w.nextNode())) a.push(n);
    return a;
  }
  function lastTextNode(el){ var a = textNodes(el).filter(function(n){ return n.nodeValue.trim(); }); return a.length ? a[a.length - 1] : null; }
  function longestWord(s){ var m = 0; s.split(/\s+/).forEach(function(w){ if(w.length > m) m = w.length; }); return m; }
  function fitTable(tb){
    var rows = [].slice.call(tb.rows); if(!rows.length) return 0;
    var n = 0, span = false;
    rows.forEach(function(r){ var c = 0; [].forEach.call(r.cells, function(x){ c += x.colSpan || 1; if((x.colSpan || 1) > 1) span = true; }); if(c > n) n = c; });
    var first = rows[0];
    if(!tb.tHead && first.cells.length && [].every.call(first.cells, function(c){ return c.tagName === "TH"; }) && rows.length > 1){
      var th = document.createElement("thead"); first.parentNode.removeChild(first); th.appendChild(first); tb.insertBefore(th, tb.firstChild);
    }
    tb.classList.remove("f11", "f10", "f9");
    if(n >= 10) tb.classList.add("f9"); else if(n >= 8) tb.classList.add("f10"); else if(n >= 6) tb.classList.add("f11");
    if(!span && !tb.querySelector("colgroup") && !tb.querySelector("th[style*='width'],td[style*='width']") && n >= 2){
      var w = [], i, j;
      for(j = 0; j < n; j++){
        var hd = first.cells[j] ? txt(first.cells[j]) : "", mx = 0, tot = 0, cnt = 0, lw = longestWord(hd);
        for(i = 1; i < rows.length; i++){ var c = rows[i].cells[j]; if(!c) continue; var t = txt(c); cnt++; tot += Math.min(t.length, 60); if(longestWord(t) > lw) lw = Math.min(longestWord(t), 18); if(t.length > mx) mx = t.length; }
        var avg = cnt ? tot / cnt : 0, v;
        if(/^(stt|tt|#|số tt|no\.?)$/i.test(hd)) v = 4;
        else v = Math.max(lw * 1.15, Math.min(avg, 48) * 0.55, hd.length * 0.32, 6);
        w.push(v);
      }
      var sum = w.reduce(function(a, b){ return a + b; }, 0), cg = document.createElement("colgroup"), used = 0;
      w.forEach(function(v, k){ var p = k === n - 1 ? Math.round((100 - used) * 10) / 10 : Math.max(4, Math.round(v / sum * 1000) / 10); used += p; var c = document.createElement("col"); c.setAttribute("style", "width:" + p + "%"); c.setAttribute("width", p + "%"); cg.appendChild(c); });
      tb.insertBefore(cg, tb.firstChild);
    }
    return n;
  }
  function run(html, land){
    html = String(html == null ? "" : html);
    var box = document.createElement("div"); box.innerHTML = html;
    var maxCols = 0;
    [].slice.call(box.querySelectorAll("p")).forEach(function(p){
      if(p.closest("table")) return;
      if(!txt(p) && !p.querySelector("img,table,hr")) p.parentNode.removeChild(p);
    });
    [].slice.call(box.querySelectorAll("p,li,h4,td,th")).forEach(function(el){
      while(el.firstChild && el.firstChild.nodeName === "BR") el.removeChild(el.firstChild);
      if(!el.closest("table.sg")) while(el.lastChild && el.lastChild.nodeName === "BR") el.removeChild(el.lastChild);
    });
    [].slice.call(box.querySelectorAll("br")).forEach(function(b){
      if(b.closest("table.sg")) return;
      var nx = b.nextSibling; if(nx && nx.nodeName === "BR" && b.parentNode) { b.parentNode.removeChild(b); }
    });
    textNodes(box).forEach(bindText);
    [].slice.call(box.querySelectorAll("p,li")).forEach(function(el){
      var t = txt(el);
      if(el.tagName === "P" && !el.closest("table") && !el.className && t.length >= 80 && !/^([-+–•]|\d+[.)]|[a-zđ]\))/i.test(t) && !/^[^.:;]{1,45}:/.test(t) && !/^Kính gửi/i.test(t)) el.classList.add("ind");
      if(t.length > 28){ var ln = lastTextNode(el); if(ln){ ln.nodeValue = ln.nodeValue.replace(/ ([^ \u00a0]{1,14})\s*$/, NB + "$1"); } }
    });
    [].slice.call(box.querySelectorAll("table.hd")).forEach(function(tb){
      var r = tb.rows[0]; if(r && r.cells.length === 2){ r.cells[0].style.width = "40%"; r.cells[1].style.width = "60%"; }
    });
    [].slice.call(box.querySelectorAll("table")).forEach(function(tb){
      if(tb.classList.contains("hd") || tb.classList.contains("sg") || tb.classList.contains("nb")) return;
      if(!tb.classList.contains("tb")) tb.classList.add("tb");
      var n = fitTable(tb); if(n > maxCols) maxCols = n;
    });
    return {html: box.innerHTML, land: !!land || maxCols >= 9};
  }
  return {run: run, tidy: function(h){ return run(h, false).html; }};
})();


/* ===== NORM: app tự hiểu và chuẩn hóa số liệu, chữ khi nhập (chạy trước khi app lưu) ===== */
var NORM = window.NORM = (function(){
  var ABBR = ["TNHH", "CP", "MTV", "UBND", "HĐND", "BQLDA", "QLDA", "TVGS", "TVTK", "CĐT", "HĐ", "QĐ", "NĐ", "TT", "BXD", "TCVN", "QCVN", "BTCT", "BTXM", "BTN", "PCCC", "ATLĐ", "VSMT", "GPMB", "KCS", "XD", "TM", "DV", "SX", "KT", "DN", "HTX", "QL", "ĐT", "BCH", "CHT", "TP", "ĐKKD", "MST"];
  var ABRE = new RegExp("(^|[^A-Za-zÀ-ỹ0-9])(" + ABBR.join("|") + ")(?![A-Za-zÀ-ỹ0-9])", "gi");
  var UNITS = {"m3": "m³", "m^3": "m³", "khối": "m³", "khoi": "m³", "m khối": "m³", "mét khối": "m³", "met khoi": "m³", "m2": "m²", "m^2": "m²", "mét vuông": "m²", "met vuong": "m²",
    "tan": "tấn", "tấn": "tấn", "kg": "kg", "cai": "cái", "cái": "cái", "bo": "bộ", "bộ": "bộ", "md": "md", "m dài": "md", "mét dài": "md", "met dai": "md", "m": "m", "lit": "lít", "lít": "lít", "cây": "cây", "cay": "cây", "viên": "viên", "vien": "viên", "tấm": "tấm", "tam": "tấm", "bao": "bao", "ca": "ca", "ngày": "ngày", "ngay": "ngày", "công": "công", "cong": "công", "hộp": "hộp", "hop": "hộp", "cuộn": "cuộn", "cuon": "cuộn", "mẻ": "mẻ", "me": "mẻ", "mẫu": "mẫu", "mau": "mẫu", "tổ": "tổ", "to": "tổ"};
  function spaces(t){
    return String(t == null ? "" : t).replace(/[\u2013\u2014]/g, "-").replace(/[ \t\r\n\u00a0]+/g, " ").replace(/ +([,.;:!?)])/g, "$1").replace(/([,;])(?=[A-Za-zÀ-ỹ])/g, "$1 ").replace(/\( +/g, "(").trim();
  }
  function text(v){
    var t = spaces(v); if(!t) return t;
    t = t.replace(ABRE, function(m, a, b){ return a + b.toUpperCase(); });
    t = t.replace(/(^|[.!?]\s)([a-zà-ỹ])/g, function(m, a, b){ return a + b.toUpperCase(); });
    return t.charAt(0).toUpperCase() + t.slice(1);
  }
  function person(v){
    var t = spaces(v); if(!t) return t;
    return t.toLowerCase().replace(/(^|[\s.\-])([a-zà-ỹ])/g, function(m, a, b){ return a + b.toUpperCase(); });
  }
  function unit(v){ var t = spaces(v), k = t.toLowerCase().replace(/\.$/, ""); return Object.prototype.hasOwnProperty.call(UNITS, k) ? UNITS[k] : t; }
  function num(v){ var t = spaces(v); if(!t) return t; var m = t.match(/^([\d][\d.,]*)$/); if(!m) return t; return t; }
  function code(v){ return spaces(v).toUpperCase(); }
  function kindOf(k){
    k = String(k || "");
    if(/^(qty|kl|khoiluong|soluong)$/i.test(k)) return "qty";
    if(/^(unit|dvt|donvi)$/i.test(k)) return "unit";
    if(/(Rep|Chief|^cht$|^cm$|^ten$|chihuy|giamdoc|nguoi|owner|ktv|tvgsChief)/i.test(k) && !/(Pos|Ngay|Date)/i.test(k)) return "person";
    if(/(Pos|chucvu|chucdanh)$/i.test(k)) return "text";
    if(/(No$|^no$|labNo|soHieu|so$|contractNo|mau$|code|ma$)/.test(k)) return "code";
    return "text";
  }
  // tách "120 m3" thành khối lượng và đơn vị
  function splitQty(t){
    var m = spaces(t).match(/^([\d][\d.,]*)\s*([A-Za-zÀ-ỹ][A-Za-zÀ-ỹ0-9^ ]{0,12})$/);
    return m ? {n: m[1], u: unit(m[2])} : null;
  }
  function onChange(e){
    var t = e.target; if(!t || !t.tagName) return;
    if(!(t.tagName === "TEXTAREA" || (t.tagName === "INPUT" && (!t.type || t.type === "text")))) return;
    if(t.id === "lgUrl" || t.getAttribute("data-nonorm") != null || t.closest("#vpaper,.paper,#td-root,[contenteditable]")) return;
    var key = t.getAttribute("data-k") || t.getAttribute("data-p") || t.getAttribute("data-f"); if(!key) return;
    var kind = kindOf(key), old = t.value, nv;
    if(kind === "qty"){
      var sp = splitQty(old);
      if(sp){
        nv = sp.n;
        var row = t.closest("tr"), ue = row && row.querySelector('[data-k="unit"],[data-k="dvt"]');
        if(ue && !ue.value.trim()){ ue.value = sp.u; ue.dispatchEvent(new Event("input", {bubbles: true})); setTimeout(function(){ ue.dispatchEvent(new Event("change", {bubbles: true})); }, 0); }
      } else nv = num(old);
    } else if(kind === "unit") nv = unit(old);
    else if(kind === "person") nv = person(old);
    else if(kind === "code") nv = code(old);
    else nv = text(old);
    if(nv !== old){ t.value = nv; t.dispatchEvent(new Event("input", {bubbles: true})); }
  }
  document.addEventListener("change", onChange, true);
  return {text: text, person: person, unit: unit, splitQty: splitQty};
})();

function previewUpdate(db, why, after){

  function li(arr, f){ return arr.length ? "<ul>" + arr.map(function(x){ return "<li>" + esc(f(x)) + "</li>"; }).join("") + "</ul>" : "<p class=\"hint\">Không có.</p>"; }
  var m = modal('<h2>Cập nhật căn cứ pháp lý lên bản ' + esc(db.version) + '</h2><p class="hint">Bản hiện tại: ' + esc(legalVer()) + '.</p><h3>Thêm mới (' + d.add.length + ')</h3>' + li(d.add, function(x){ return x.loai + " " + x.so; }) + '<h3>Thay đổi (' + d.chg.length + ')</h3>' + li(d.chg, function(x){ return x.loai + " " + x.so + (x.hetHL ? " (hết hiệu lực từ " + fmtD(x.hetHL) + ")" : ""); }) + '<h3>Bỏ khỏi kho (' + d.rem.length + ')</h3>' + li(d.rem, function(x){ return x.loai + " " + x.so; }) + '<div class="tools" style="justify-content:flex-end;margin:14px 0 0"><button class="btn" data-x="0">Thôi</button><button class="btn pri" data-x="1">Áp dụng</button></div>', null, 640);
  m.addEventListener("click", function(e){
    var b = e.target.closest("[data-x]"); if(!b) return;
    if(b.getAttribute("data-x") === "1"){ legalApply(db, why); closeModal(m); toast("Đã cập nhật căn cứ pháp lý lên bản " + db.version); if(after) after(); }
    else closeModal(m);
  });
}

/* Mô-đun Hồ sơ quản lý chất lượng: động cơ văn bản, trình xem, các màn hình nhập liệu. Tác giả: Lê Quang Hòa */

function guessType(name, cur){
  var n = (name || "").toLowerCase();
  var rules = [
    ["tl", /kè|đê|kênh|đập|hồ chứa|thủy lợi|thuỷ lợi|bờ sông|suối/],
    ["cau", /cầu|cống hộp|cống tròn|cống qua đường/],
    ["gt", /đường|tuyến|vỉa hè|nhựa|bê tông nhựa|giao thông|quốc lộ|tỉnh lộ/],
    ["ht", /cấp nước|thoát nước|nước thải|hạ tầng|ống cấp|hố ga/],
    ["dien", /điện|chiếu sáng|trạm biến áp|đường dây/],
    ["cn", /nhà xưởng|xưởng|nhà thép|kho |nhà máy|khu công nghiệp/],
    ["sc", /sửa chữa|cải tạo|nâng cấp|duy tu/],
    ["nd", /nhà|trường|trụ sở|chợ|hội trường|bệnh viện|trạm y tế|văn hóa|công trình công cộng|khuôn viên/]
  ];
  for(var i = 0; i < rules.length; i++){ if(rules[i][1].test(n)) return rules[i][0]; }
  return cur || "nd";
}

/* ---------- Động cơ văn bản ---------- */
function dkey(d, it){ return it ? d.id + ":" + it.id : d.id; }
function dmeta(d, it){ var k = dkey(d, it); return S.q.docs[k] || (S.q.docs[k] = {}); }
function metaFor(d, it){
  var m = dmeta(d, it), dt = m.date || (it && d.itemDate ? d.itemDate(it) : "") || "";
  var o = {no: m.no || "", date: dt, from: m.from, to: m.to};
  if(d.range){ o.to = o.to || todayISO(); o.from = o.from || addDaysISO(o.to, -6); }
  return o;
}
function ensureNo(d, it){
  var m = dmeta(d, it);
  if(!m.no){ var c = S.q.counters[d.pfx] = (S.q.counters[d.pfx] || 0) + 1; m.no = pad(c) + "/" + d.pfx; }
  return m.no;
}
function docList(d){ return d.kind === "item" ? ((d.store === "g" ? S.g : S.q)[d.items] || []) : null; }
function docHTML(d, it, noAssign){
  if(!noAssign) ensureNo(d, it);
  var m = dmeta(d, it);
  if(m.html) return m.html;
  return d.build(metaFor(d, it), it);
}
function docTitle(d, it){ return d.name + (it && d.itemName ? " - " + d.itemName(it) : ""); }
var ST_PCT = {todo:0, draft:30, done:70, signed:100, sent:100};
function docProgress(d){
  if(d.kind === "item"){
    var arr = docList(d), n = arr.length, sg = 0, sum = 0;
    arr.forEach(function(it){ var s = (S.q.docs[dkey(d, it)] || {}).status || "todo"; sum += ST_PCT[s] || 0; if(s === "signed" || s === "sent") sg++; });
    return {pct: n ? Math.round(sum / n) : 0, label: n ? sg + "/" + n + " đã ký" : "Chưa có dữ liệu", n: n, signed: sg};
  }
  var m = S.q.docs[d.id] || {}, st = m.status || "todo";
  if(st === "na") return {pct: null, label: "Không áp dụng"};
  return {pct: ST_PCT[st] || 0, label: STATUS[st].n};
}
function countGaps(html){ var m = html.match(/class="gap"/g); return m ? m.length : 0; }


/* ===== Văn bản tự soạn: mọi loại văn bản dự án cần mà danh mục chưa có, app tự dựng đúng thể thức ===== */
var CX_TYPES = {
  cv: {n: "Công văn", pfx: "CV", head: "org"},
  tt: {n: "Tờ trình", pfx: "TTr", head: "org"},
  tb: {n: "Thông báo", pfx: "TB", head: "org"},
  bc: {n: "Báo cáo", pfx: "BC", head: "org"},
  bb: {n: "Biên bản làm việc, họp", pfx: "BB", head: "qh"},
  qd: {n: "Quyết định", pfx: "QĐ", head: "org"},
  uq: {n: "Giấy ủy quyền", pfx: "UQ", head: "org"},
  cn: {n: "Giấy xác nhận, cam kết", pfx: "XN", head: "org"},
  dn: {n: "Đề nghị, phiếu yêu cầu", pfx: "ĐN", head: "org"}
};
function cxBody(txt){
  return String(txt || "").split(/\n+/).map(function(l){ return l.trim(); }).filter(Boolean).map(function(l){
    return /^[-+•]/.test(l) ? para(esc(l.replace(/^[-+•]\s*/, "- "))) : para(esc(l));
  }).join("");
}
function cxBuild(c){
  return function(meta){
    var P = PJ(), T = CX_TYPES[c.type] || CX_TYPES.cv, body = c.content ? cxBody(c.content) : para('<span class="gap">Nội dung văn bản</span>');
    var to = c.to ? "Kính gửi: " + esc(c.to) : (c.type === "bb" || c.type === "qd" || c.type === "uq" ? "" : "Kính gửi: " + V(P.cdt));
    var head = T.head === "qh" ? headQH(meta) : headOrg(meta);
    var h = head + title(esc(T.n.split(",")[0].toUpperCase()), esc(c.title || "")) + (to ? para(to) : "");

/* Soát lỗi tự động (không cần AI): gạch dài, dấu câu, từ lặp, đếm ô trống */
function autoFixText(paper){
  var w = document.createTreeWalker(paper, NodeFilter.SHOW_TEXT, null), n, fixes = 0, a = [];
  while((n = w.nextNode())) a.push(n);
  a.forEach(function(t){
    if(t.parentNode && t.parentNode.closest && t.parentNode.closest(".gap")) return;
    var o = t.nodeValue, v = o.replace(/[\u2013\u2014]/g, "-").replace(/[ \t]+([,.;:!?])/g, "$1").replace(/([,;])(?=[A-Za-zÀ-ỹ])/g, "$1 ").replace(/(^|[\s(])([a-zà-ỹ]{2,}) \2(?=[\s.,;:)]|$)/g, "$1$2").replace(/[ \t]{2,}/g, " ");
    if(v !== o){ t.nodeValue = v; fixes++; }
  });
  return {fixes: fixes, gaps: paper.querySelectorAll(".gap").length};
}

/* ---------- Cảnh báo, việc cần làm ---------- */
function alertsList(){
  if(ROLE() === "tvgs") return gsAlerts();
  if(ROLE() === "qlda") return qlAlerts();
  var P = PJ(), out = [], td = todayISO();
  var miss = [];
  if(!P.name) miss.push("tên dự án"); if(!P.loc) miss.push("địa chỉ xây dựng"); if(!P.cdt) miss.push("chủ đầu tư"); if(!P.qlda) miss.push("tư vấn quản lý dự án");
  if(!P.tvgs) miss.push("tư vấn giám sát"); if(!P.nt) miss.push("đơn vị thi công"); if(!P.startDate || !P.endDate) miss.push("thời gian thực hiện");
  if(miss.length) out.push({lv:"warn", t:"Thông tin dự án còn thiếu: " + miss.join(", ") + ". Các hồ sơ sẽ có chỗ trống.", go:"#/du-an"});
  var noRes = S.q.materials.filter(function(m){ return !m.result; }).length;
  if(noRes) out.push({lv:"warn", t:noRes + " lô vật liệu chưa có kết quả thí nghiệm, chưa nên đưa vào sử dụng.", go:"#/vat-lieu"});
  var due = S.q.tests.filter(function(t){ return !t.pass && t.dueDate && t.dueDate <= addDaysISO(td, 3); });
  if(due.length) out.push({lv:"bad", t:due.length + " mẫu thí nghiệm đã đến hoặc sắp đến hạn (trong 3 ngày) mà chưa có kết quả.", go:"#/thi-nghiem"});
  var nw = S.q.works.filter(function(w){ return !w.result && w.date && w.date <= td; }).length;
  if(nw) out.push({lv:"warn", t:nw + " công việc đã quá ngày dự kiến nghiệm thu nhưng chưa ghi kết luận.", go:"#/cong-viec"});
  var ncr = S.q.ncr.filter(function(n){ return n.status !== "xong"; }).length;
  if(ncr) out.push({lv:"bad", t:ncr + " công việc không phù hợp chưa khắc phục xong.", go:"#/khong-phu-hop"});
  if(P.startDate && P.startDate <= td){
    var have = {}; S.q.diary.forEach(function(d){ have[d.date] = 1; });
    var m = 0, from = addDaysISO(td, -14); if(from < P.startDate) from = P.startDate;
    var endd = P.endDate && P.endDate < td ? P.endDate : td;
    for(var d = from; d <= endd; d = addDaysISO(d, 1)){ if(!have[d]) m++; }
    if(m > 0) out.push({lv:"warn", t:"Nhật ký thi công thiếu " + m + " ngày trong 14 ngày gần nhất.", go:"#/nhat-ky"});
  }
  legalAlerts().forEach(function(a){ out.push(a); });
  if(!out.length) out.push({lv:"ok", t:"Chưa có việc tồn đọng. Cứ tiếp tục ghi nhật ký và nghiệm thu đều đặn.", go:""});
  return out;
}

/* ---------- Xuất hồ sơ ---------- */
function allDocFiles(opts){
  opts = opts || {};
  var files = [], n = 0;
  RD().forEach(function(d, di){
    var num = pad(di + 1);
    if(d.kind === "item"){
      var list = docList(d); if(!list.length) return;
      list.forEach(function(it, i){
        files.push({d:d, it:it, folder:num + ". " + fileSafe(d.name), name:pad(i + 1) + ". " + fileSafe(d.itemName(it)).slice(0, 60) + ".doc"});
      });
    } else {
      var m = S.q.docs[d.id] || {}; if(m.status === "na") return;
      files.push({d:d, it:null, folder:"", name:num + ". " + fileSafe(d.name) + ".doc"});
    }
  });
  return files;
}
function tocHTML(files){
  var rows = [], n = 0;
  RD().forEach(function(d){
    var m = S.q.docs[d.id] || {}; if(m.status === "na") return;
    var pr = docProgress(d); n++;
    rows.push([String(n), esc(d.name), esc(GROUPS[d.g].replace(/^[A-Z]\.\s*/, "")), esc(pr.label)]);
  });
  var P = PJ();
  return title("MỤC LỤC BỘ HỒ SƠ QUẢN LÝ CHẤT LƯỢNG THI CÔNG", V(P.name)) + lead() + para("Nhà thầu thi công: " + V(P.nt) + ". Thời gian thực hiện: " + dStr(P.startDate) + " đến " + dStr(P.endDate) + ".") +

    '<div class="foot">Bộ hồ sơ được lập bằng ứng dụng "' + esc(APP_NAME) + '". Tác giả: ' + esc(APP_AUTHOR) + ".</div>";
}
function exportZip(){
  var enc = new TextEncoder(), files = allDocFiles(), out = [];
  out.push({name:"00. Mục lục bộ hồ sơ.doc", data:enc.encode("﻿" + wordDoc("Mục lục", tocHTML(files), false))});
  files.forEach(function(f){
    var html = docHTML(f.d, f.it), nm = (f.folder ? f.folder + "/" : "") + f.name;
    out.push({name:nm, data:enc.encode("﻿" + wordDoc(docTitle(f.d, f.it), html, f.d.land))});
  });
  download(fileSafe(PJ().name || "Ho so chat luong") + " - Ho so QLCL.zip", makeZip(out));
  save(); toast("Đã tạo file ZIP gồm " + out.length + " hồ sơ Word");
}
function printAll(){
  var files = allDocFiles(), parts = [paperWrap(tocHTML(files), false)];
  files.forEach(function(f){ parts.push(paperWrap(docHTML(f.d, f.it), f.d.land)); });
  save(); printHTML(parts);
}
function gapReport(){
  var rows = [];
  allDocFiles().forEach(function(f){
    var g = countGaps(docHTML(f.d, f.it, true));
    if(g) rows.push({n:docTitle(f.d, f.it), g:g});
  });
  rows.sort(function(a, b){ return b.g - a.g; });
  return rows;
}

function gsAlerts(){
  var out = [], td = todayISO(), P = S.project;
  var miss = []; if(!P.name) miss.push("tên dự án"); if(!P.tvgs) miss.push("đơn vị tư vấn giám sát"); if(!P.nt) miss.push("đơn vị thi công"); if(!P.cdt) miss.push("chủ đầu tư");
  if(miss.length) out.push({lv:"warn", t:"Thông tin dự án còn thiếu: " + miss.join(", ") + ".", go:"#/du-an"});
  var m = S.q.materials.filter(function(x){ return !x.gsOpinion; }).length; if(m) out.push({lv:"warn", t:m + " lô vật liệu chưa có ý kiến của tư vấn giám sát.", go:"#/gs-vat-lieu"});
  var w = S.q.works.filter(function(x){ return !x.gsResult && (x.pycDate || x.date); }).length; if(w) out.push({lv:"warn", t:w + " công việc nhà thầu đã yêu cầu nghiệm thu, chờ kết luận giám sát.", go:"#/gs-cong-viec"});
  var t1 = S.q.tests.filter(function(x){ return !x.witness; }).length; if(t1) out.push({lv:"warn", t:t1 + " mẫu thí nghiệm chưa ghi nhận đã chứng kiến.", go:"#/gs-thi-nghiem"});
  var t2 = S.q.tests.filter(function(x){ return !x.pass && x.dueDate && x.dueDate <= addDaysISO(td, 3); }).length; if(t2) out.push({lv:"bad", t:t2 + " mẫu đã đến hoặc sắp đến hạn thí nghiệm mà chưa có kết quả.", go:"#/gs-thi-nghiem"});
  var r = S.q.ncr.filter(function(x){ return x.status !== "xong" && x.due && x.due < td; }).length; if(r) out.push({lv:"bad", t:r + " yêu cầu khắc phục đã quá thời hạn mà nhà thầu chưa xong.", go:"#/gs-yeu-cau"});
  if(P.startDate && P.startDate <= td){
    var have = {}; S.g.diary.forEach(function(d){ have[d.date] = 1; }); var mm = 0, from = addDaysISO(td, -14); if(from < P.startDate) from = P.startDate;
    var endd = P.endDate && P.endDate < td ? P.endDate : td; for(var d = from; d <= endd; d = addDaysISO(d, 1)){ if(!have[d]) mm++; }
    if(mm > 0) out.push({lv:"warn", t:"Nhật ký giám sát thiếu " + mm + " ngày trong 14 ngày gần nhất.", go:"#/gs-nhat-ky"});
  }
  try{ if(window.TienDo && TienDo.getTasks){ var late = TienDo.getTasks().filter(function(x){ return !x.summary && x.end && x.end < td && (x.pct || 0) < 100; }).length; if(late) out.push({lv:"bad", t:late + " công việc chậm so với tiến độ kế hoạch.", go:"#/tien-do"}); } }catch(e){}
  legalAlerts().forEach(function(a){ out.push(a); });
  if(!out.length) out.push({lv:"ok", t:"Chưa có việc tồn đọng.", go:""});
  return out;
}

/* ---------- Gói trao đổi hồ sơ ---------- */
var OWN = {
  materials: {nt:["name","spec","unit","qty","supplier","origin","std","docs","tests","recvDate","sampleDate","labNo","labDate","result","ntDate","use"], gs:["gsOpinion","gsDate","gsNote"]},
  works: {nt:["name","loc","qty","unit","std","checks","from","to","pycDate","date","result","tdId"], gs:["gsResult","gsDate","gsNote"]},
  tests: {nt:["kind","what","loc","sampleNo","sampleDate","age","dueDate","std","labNo","pass"], gs:["witness"]}
};
function clone(x){ return JSON.parse(JSON.stringify(x)); }
function pkgProject(){ var P = S.project; return {name:P.name, loc:P.loc, cdt:P.cdt, qlda:P.qlda, tvgs:P.tvgs, nt:P.nt, startDate:P.startDate, endDate:P.endDate, type:P.type, hdNo:P.hdNo, hdDate:P.hdDate}; }
function pkgBuild(kind){
  var role = ROLE(), pk = {app:"lqh-goi", ver:1, kind:kind, from:role, at:todayISO(), project:pkgProject(), author:APP_AUTHOR};
  if(kind === "goi-nop"){ pk.materials = clone(S.q.materials); pk.works = clone(S.q.works); pk.tests = clone(S.q.tests); pk.diary = clone(S.q.diary); pk.ncr = clone(S.q.ncr.filter(function(n){ return n.source !== "gs"; })); }
  else if(kind === "goi-phan-hoi"){
    ["materials", "works", "tests"].forEach(function(c){
      pk[c] = S.q[c].filter(function(r){ return r.src === "gs" || OWN[c].gs.some(function(f){ return r[f]; }); }).map(function(r){
        if(r.src === "gs") return clone(r);
        var o = {id:r.id}; OWN[c].gs.forEach(function(f){ o[f] = r[f] || ""; }); return o; });
    });
    pk.ncr = clone(S.q.ncr.filter(function(n){ return n.source === "gs"; }));
    pk.insp = clone(S.g.insp);
  } else if(kind === "goi-bao-cao"){ pk.report = gsReportData(); }
  return pk;
}
function gsReportData(){
  var td = todayISO(), tasks = [], sm = null;
  try{ if(window.TienDo){ sm = TienDo.getSummary ? TienDo.getSummary() : null; tasks = TienDo.getTasks ? TienDo.getTasks().filter(function(x){ return !x.summary && x.end && x.end < td && (x.pct || 0) < 100; }).map(function(x){ return {name:x.name, end:x.end, pct:x.pct || 0}; }) : []; } }catch(e){}
  return {
    date: td,
    materials:{total:S.q.materials.length, ok:S.q.materials.filter(function(m){ return m.gsOpinion === "ok"; }).length, no:S.q.materials.filter(function(m){ return m.gsOpinion === "no"; }).length, wait:S.q.materials.filter(function(m){ return !m.gsOpinion; }).length},
    works:{total:S.q.works.length, ok:S.q.works.filter(function(w){ return w.gsResult === "dat"; }).length, redo:S.q.works.filter(function(w){ return w.gsResult === "kdat"; }).length, wait:S.q.works.filter(function(w){ return !w.gsResult; }).length},
    tests:{total:S.q.tests.length, ok:S.q.tests.filter(function(t){ return t.pass === "dat"; }).length, bad:S.q.tests.filter(function(t){ return t.pass === "kdat"; }).length},
    ncr:{open:S.q.ncr.filter(function(n){ return n.status !== "xong"; }).length, overdue:S.q.ncr.filter(function(n){ return n.status !== "xong" && n.due && n.due < td; }).length, stop:S.q.ncr.filter(function(n){ return n.stop && n.status !== "xong"; }).length, list:S.q.ncr.filter(function(n){ return n.status !== "xong"; }).slice(0, 12).map(function(n){ return {desc:n.desc, loc:n.loc, due:n.due, stop:n.stop}; })},
    diaryDays:S.g.diary.length, schedule:sm, late:tasks.slice(0, 12)
  };
}
function mergeColl(arr, inc, fields){
  var map = {}, add = 0, upd = 0; arr.forEach(function(x){ map[x.id] = x; });
  (inc || []).forEach(function(r){
    var cur = map[r.id];
    if(!cur){ if(r.name !== undefined || r.kind !== undefined || r.date !== undefined || r.desc !== undefined){ arr.push(clone(r)); add++; } return; }
    var ch = false; (fields || Object.keys(r)).forEach(function(f){ if(r[f] !== undefined && cur[f] !== r[f] && f !== "id"){ cur[f] = r[f]; ch = true; } });
    if(ch) upd++;
  });
  return {add:add, upd:upd};
}
function pkgImport(pk){
  var role = ROLE(), res = [], P = S.project;
  if(!pk || pk.app !== "lqh-goi") throw new Error("Không phải file gói trao đổi của ứng dụng này");
  if(pk.project){ ["name","loc","cdt","qlda","tvgs","nt","startDate","endDate","type","hdNo","hdDate"].forEach(function(k){ if(!P[k] && pk.project[k]) P[k] = pk.project[k]; }); if(P.startDate && P.endDate) P.days = String(diffDays(P.startDate, P.endDate) + 1); S.setup = true; }
  if(pk.kind === "goi-nop" && role !== "nt"){
    ["materials", "works", "tests"].forEach(function(c){ var r = mergeColl(S.q[c], pk[c], OWN[c].nt); res.push(c + ": thêm " + r.add + ", sửa " + r.upd); });
    var rn = mergeColl(S.q.diary, pk.diary, null); res.push("nhật ký nhà thầu: thêm " + rn.add + ", sửa " + rn.upd);
    var rc = mergeColl(S.q.ncr, pk.ncr, null); res.push("không phù hợp: thêm " + rc.add + ", sửa " + rc.upd);
  } else if(pk.kind === "goi-phan-hoi" && role === "nt"){
    ["materials", "works", "tests"].forEach(function(c){ var r = mergeColl(S.q[c], pk[c], OWN[c].gs); res.push(c + ": cập nhật " + r.upd + (r.add ? ", thêm " + r.add : "")); });
    var r2 = mergeColl(S.q.ncr, pk.ncr, null); res.push("yêu cầu khắc phục: thêm " + r2.add + ", sửa " + r2.upd);

/* Khung ứng dụng: điều hướng, nhập thông tin dự án, tổng quan, mô-đun tiến độ, hướng dẫn. Tác giả: Lê Quang Hòa */

  /* ---------- thư mục đồng bộ ---------- */
  function nf(e){ return e && (e.name === "NotFoundError" || e.name === "TypeMismatchError"); }
  function makeHandleFs(root){
    async function dir(path, create){ var h = root; for(var i = 0; i < path.length; i++){ h = await h.getDirectoryHandle(path[i], {create: !!create}); } return h; }
    return {
      root: root,
      async list(path){ try{ var d = await dir(path), out = []; for await (var e of d.values()) out.push({name: e.name, dir: e.kind === "directory"}); return out; }catch(e){ if(nf(e)) return []; throw e; } },
      async readBlob(path){ try{ var d = await dir(path.slice(0, -1)), fh = await d.getFileHandle(path[path.length - 1]); return await fh.getFile(); }catch(e){ if(nf(e)) return null; throw e; } },
      async readText(path){ var f = await this.readBlob(path); return f ? await f.text() : null; },
      async write(path, data){ var d = await dir(path.slice(0, -1), true), fh = await d.getFileHandle(path[path.length - 1], {create: true}), w = await fh.createWritable(); await w.write(data); await w.close(); },
      async remove(path){ try{ var d = await dir(path.slice(0, -1)); await d.removeEntry(path[path.length - 1], {recursive: true}); }catch(e){ if(!nf(e)) throw e; } }
    };
  }
  function makeMemFs(){
    var root = {c: {}};
    function walk(path, create){ var n = root; for(var i = 0; i < path.length; i++){ var k = path[i]; if(!n.c[k]){ if(!create) return null; n.c[k] = {c: {}}; } n = n.c[k]; if(!n.c) return null; } return n; }
    return {
      mem: root,
      async list(p){ var n = walk(p); return n ? Object.keys(n.c).map(function(k){ return {name: k, dir: !!n.c[k].c}; }) : []; },
      async readBlob(p){ var n = walk(p.slice(0, -1)), f = n && n.c[p[p.length - 1]]; return f && !f.c ? f.data : null; },
      async readText(p){ var b = await this.readBlob(p); return b ? await b.text() : null; },
      async write(p, data){ var n = walk(p.slice(0, -1), true); n.c[p[p.length - 1]] = {data: data instanceof Blob ? data : new Blob([data])}; },
      async remove(p){ var n = walk(p.slice(0, -1)); if(n) delete n.c[p[p.length - 1]]; }
    };
  }
  async function pickFolder(){
    try{
      var h = await window.showDirectoryPicker({mode: "readwrite", id: "lqhkho"});
      await queue(function(){ return put("meta", {k: "fs", handle: h}); });
      fsx = makeHandleFs(h); fsLabel = h.name; needPerm = false; syncErr = "";
      await fsx.write([appDir(), "_lqh.json"], JSON.stringify({app: appDir(), tao: new Date().toISOString(), tacGia: "Lê Quang Hòa"}));

    }catch(e){ if(e && e.name !== "AbortError") toast("Không chọn được thư mục: " + (e.message || e), 6000); return false; }
  }

  function bindCore(root){
    $$("[data-p]", root).forEach(function(inp){
      inp.addEventListener("change", function(){
        var P = S.project, k = inp.getAttribute("data-p"), v = inp.value.trim();
        P[k] = v;
        if(k === "days" && P.startDate && /^\d+$/.test(v) && +v > 0){ P.endDate = addDaysISO(P.startDate, +v - 1); var e = $("[data-p=endDate]", root); if(e) e.value = P.endDate; }
        if((k === "startDate" || k === "endDate") && P.startDate && P.endDate){ P.days = String(diffDays(P.startDate, P.endDate) + 1); var d = $("[data-p=days]", root); if(d) d.value = P.days; }
        if(k === "startDate" && P.days && /^\d+$/.test(P.days) && !P.endDate){ P.endDate = addDaysISO(P.startDate, +P.days - 1); var e2 = $("[data-p=endDate]", root); if(e2) e2.value = P.endDate; }
        if(k === "name") P.type = guessType(v, P.type);
        if(!P.place && P.loc){ var parts = P.loc.split(","); P.place = parts.length > 1 ? parts[parts.length - 1].trim() : ""; }
        S.setup = true; save(); $("#topTitle").textContent = P.name || "Chưa đặt tên dự án";
        if(k === "type") { /* không dùng */ }
      });
    });
  }

    };
  }

      '<div class="card"><h2>Ba vai trò, một dự án</h2><p>Chọn vai trò ở góc trên thanh bên: <b>Nhà thầu thi công</b>, <b>Tư vấn giám sát</b>, <b>App cho nhà thầu quản lý dự án</b>. Mỗi vai có menu và bộ hồ sơ riêng. Nhà thầu xuất <b>gói nộp</b> gửi tư vấn giám sát; tư vấn giám sát kiểm tra, ghi ý kiến rồi xuất <b>gói phản hồi</b> trả nhà thầu và <b>gói báo cáo</b> gửi quản lý dự án. Mỗi bên chỉ cập nhật phần việc của mình, ở mục Trao đổi hồ sơ.</p></div>' +
      '<div class="card" id="bakCard"><h2>Khôi phục bản dự phòng</h2><p>Ứng dụng tự giữ một bản dự phòng, làm mới mỗi 10 phút và trước khi tạo dự án mới. ' + (backupInfo() ? "Bản hiện có: <b>" + backupInfo() + "</b>." : "Hiện chưa có bản nào.") + '</p><button class="btn" id="bakBtn"' + (backupInfo() ? "" : " disabled") + '>Khôi phục bản dự phòng</button></div>' +
      '<div class="card"><h2>Dữ liệu lưu ở đâu</h2><p>Mọi dự án và văn bản tự lưu trong kho của app trên máy này, không cần bấm lưu. Muốn dùng nhiều máy, bấm nút <b>☁</b> ở thanh trên rồi chọn thư mục nằm trong Google Drive (hoặc OneDrive). Nút <b>Lưu file</b> dùng để xuất riêng một dự án gửi anh em (không kèm văn bản trong kho).</p></div>' +
      '<div class="card"><h2>Giới thiệu</h2><p><b>' + esc(APP_NAME) + "</b>, phiên bản " + APP_VER + '.<br>Tác giả: <b>' + esc(APP_AUTHOR) + '</b>.<br>Ứng dụng xây dựng để hỗ trợ anh em trong ngành xây dựng lập tiến độ thi công và hồ sơ quản lý chất lượng thuận lợi hơn.</p></div>';
    var bb = $("#bakBtn", el);
    if(bb) bb.onclick = function(){ askConfirm("Khôi phục sẽ thay dữ liệu đang mở bằng bản dự phòng " + backupInfo() + ". Tiếp tục?", function(){ if(restoreBackup()){ reload(); toast("Đã khôi phục bản dự phòng"); } else toast("Không khôi phục được"); }, "Khôi phục"); };
  }

  function boot(){
    document.documentElement.setAttribute("data-role", ROLE());
    var had = Kho.loadActive(); legalInit();
    buildFrame(); drawNav(); Kho.start(); TroLy.mount(); Lic.start();
    window.addEventListener("hashchange", route);
    route();
    if(!S.setup || !S.project.name){ setTimeout(openSetup, 200); }
    var flush = function(){ if(S) doSave(); };
    window.addEventListener("beforeunload", flush);
    window.addEventListener("pagehide", flush);
    document.addEventListener("visibilitychange", function(){ if(document.visibilityState === "hidden") flush(); });
    try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
    try{ var cn = /[?&]capnhat=([0-9][0-9.]*)/.exec(location.search); if(cn) setTimeout(function(){ toast("Ứng dụng đã tự cập nhật lên phiên bản " + cn[1] + ". Dữ liệu của bạn được giữ nguyên.", 7000); }, 900); }catch(e){}
    if(recovered) setTimeout(function(){ toast("Dữ liệu chính bị lỗi, em đã tự khôi phục từ bản dự phòng " + backupInfo() + ".", 7000); }, 600);
    else if(S.setup && S.project.name){
      var fa = +lsGet(FILE_AT) || 0, days = fa ? (Date.now() - fa) / 86400000 : 99;
      if(days > 7) setTimeout(function(){ toast(fa ? "Đã " + Math.floor(days) + " ngày chưa lưu file dự phòng. Sếp bấm Lưu file, cất vào ổ D hoặc USB nhé." : "Sếp chưa lưu file dự phòng lần nào. Bấm Lưu file, cất vào ổ D hoặc USB nhé.", 6500); }, 1500);
    }
  }
  return {boot: boot, refresh: refresh, reload: reload};
})();
document.addEventListener("DOMContentLoaded", function(){ Kho.init().then(function(){ Shell.boot(); }); });

})();
</script>
